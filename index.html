<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Device Carousel</title>
  <meta name="description" content="A scroll-driven carousel of isometric 3D devices in plain HTML, CSS and JavaScript." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The carousel. devices.js fills .dv-stage and .dv-items from data.js. -->
  <section class="dv-sec" aria-labelledby="dv-h">
    <div class="dv-pin">
      <div class="dv-stage"></div>
      <ol class="dv-items"></ol>
      <p class="dv-hint mono" aria-hidden="true">Scroll · click the centered device to open</p>
      <div class="dv-head mono">
        <h2 id="dv-h">Devices</h2>
        <span class="dim dv-count"></span>
        <a class="dim" href="https://github.com/kaiser-xxx/device-carousel">GitHub</a>
      </div>
    </div>
  </section>

  <script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
  <link rel="modulepreload" href="vendor/three/three.module.min.js" />
  <link rel="preload" href="models/pixel.glb" as="fetch" crossorigin />
  <script src="data.js"></script>
  <script type="module" src="devices.js"></script>
</body>
</html>
